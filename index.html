<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astroamigos Misiones | App</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            /* Palette Espacial */
            --bg-deep: #05070a;
            --bg-gradient: radial-gradient(circle at bottom, #1b2735 0%, #090a0f 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --accent-cyan: #00f3ff;
            --accent-purple: #bc13fe;
            --text-main: #e0e6ed;
            --text-muted: #94a3b8;
            
            --success: #00e676;
            --danger: #ff1744;
            
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .brand {
            font-family: 'Exo 2', sans-serif;
        }

        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px),
                var(--bg-gradient);
            background-size: 550px 550px, 350px 350px, 250px 250px, 100% 100%;
            background-position: 0 0, 40px 60px, 130px 270px, 0 0;
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: var(--glass-highlight); border-radius: 3px; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* --- Landing Page Corregida --- */
        #landing-page {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 2000;
            transition: opacity 0.6s ease, transform 0.6s ease;
            background: radial-gradient(ellipse at center, #1b2735 0%, #090a0f 100%);
            padding: 20px;
            overflow-y: auto; /* Evita desborde en pantallas bajas */
            text-align: center;
        }

        .landing-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            width: 100%;
        }

        .planet-graphic {
            width: 120px; height: 120px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(188, 19, 254, 0.4), inset -20px -20px 40px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            position: relative;
            animation: float 6s ease-in-out infinite;
            flex-shrink: 0;
        }
        
        .planet-ring {
            position: absolute; top: 50%; left: 50%;
            width: 180px; height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .landing-content h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            background: linear-gradient(to right, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .btn-glow {
            padding: 16px 48px;
            background: transparent;
            color: var(--accent-cyan);
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid var(--accent-cyan);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 30px;
            display: flex; align-items: center; gap: 10px;
        }

        .btn-glow:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }

        /* --- App Layout --- */
        #app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; margin: 15px 20px 0 20px;
        }

        .brand {
            display: flex; align-items: center; gap: 12px;
            font-size: 1.6rem; font-weight: 700; color: white;
        }

        .nav-desktop { display: flex; gap: 10px; }

        .nav-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 10px 20px; cursor: pointer; border-radius: 20px;
            display: flex; align-items: center; gap: 8px; transition: var(--transition);
        }

        .nav-btn.active { color: #000; background: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }

        .main-content { flex: 1; padding: 20px; overflow-y: auto; max-width: 1400px; width: 100%; margin: 0 auto; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px; margin-bottom: 25px; }

        .glass-input { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: white; padding: 10px 15px; border-radius: 30px; outline: none; }

        .btn-action { padding: 10px 20px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-add { background: linear-gradient(135deg, var(--accent-purple), #7b1fa2); color: white; }
        .btn-pdf { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        thead { background: rgba(0, 243, 255, 0.1); color: var(--accent-cyan); }

        .mobile-nav {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border); justify-content: space-around;
            padding: 10px 5px; z-index: 1000;
        }
        
        .mobile-nav-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.75rem; }
        .mobile-nav-btn.active { color: var(--accent-cyan); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2500; }
        .modal-content { background: #12151c; width: 90%; max-width: 500px; padding: 30px; border-radius: var(--radius); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--accent-cyan); }
        .form-group input { width: 100%; background: #0a0c10; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 3000; }
        .toast { background: rgba(20, 25, 35, 0.95); border-left: 4px solid var(--accent-cyan); color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 10px; animation: slideIn 0.3s ease; }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        @media (max-width: 900px) {
            .nav-desktop { display: none; }
            .mobile-nav { display: flex; }
            .main-content { padding-bottom: 80px; }
        }

        @media (max-width: 768px) {
            .action-bar { flex-direction: column; gap: 15px; }
            thead { display: none; }
            tr { display: block; background: rgba(255,255,255,0.03); margin-bottom: 15px; border-radius: 10px; padding: 10px; }
            td { display: flex; justify-content: space-between; text-align: right; border: none; }
            td::before { content: attr(data-label); color: var(--accent-cyan); font-weight: bold; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="landing-page">
        <div class="landing-content">
            <div class="planet-graphic">
                <div class="planet-ring"></div>
            </div>
            <h1>Astroamigos</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; margin-bottom: 10px;">
                Portal Astronómico de Misiones, Argentina.
            </p>
            <p id="api-status" style="color: var(--accent-cyan); font-size: 0.9rem;">
                <i class="fas fa-sync fa-spin"></i> Sincronizando con las estrellas...
            </p>
            <button class="btn-glow" onclick="enterApp()">
                <i class="fas fa-rocket"></i> Iniciar Viaje
            </button>
        </div>
    </div>

    <div id="app-container">
        <header class="app-header glass">
            <div class="brand">
                <i class="fas fa-meteor" style="color: var(--accent-cyan);"></i>
                <span>ASTRO<span style="color: var(--accent-cyan)">AMIGOS</span></span>
            </div>
            <nav class="nav-desktop"></nav>
            <button class="btn-exit" style="background:none; border:1px solid var(--danger); color:var(--danger); padding:8px 15px; border-radius:20px; cursor:pointer;" onclick="showExitModal()">
                <i class="fas fa-power-off"></i>
            </button>
        </header>

        <main class="main-content">
            <div class="action-bar glass">
                <h2 id="page-title" class="page-title">Cargando...</h2>
                <div class="controls" style="display:flex; gap:10px;">
                    <input type="text" id="search-input" class="glass-input" placeholder="Buscar..." onkeyup="filterTable()">
                    <button class="btn-action btn-add" onclick="openModal()"><i class="fas fa-plus"></i></button>
                    <button class="btn-action btn-pdf" onclick="exportPDF()"><i class="fas fa-file-pdf"></i></button>
                </div>
            </div>

            <div class="table-wrapper glass">
                <table id="data-table">
                    <thead><tr id="table-head"></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </main>

        <nav class="mobile-nav"></nav>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="if(event.target==this) closeModal()">
        <div class="modal-content glass">
            <h3 id="modal-title" style="color:white; margin-bottom:20px;">Nuevo Registro</h3>
            <div id="modal-form-container"></div>
            <button class="btn-action btn-add" style="width:100%; margin-top:20px; justify-content:center;" onclick="saveData()">Confirmar</button>
        </div>
    </div>

    <div id="exit-modal-overlay" class="modal-overlay">
        <div class="modal-content glass" style="text-align:center;">
            <h3 style="color:var(--danger)">¿Salir?</h3>
            <p style="color:var(--text-muted); margin: 15px 0;">Se perderán los cambios no guardados.</p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn-action" style="background:gray; color:white;" onclick="document.getElementById('exit-modal-overlay').style.display='none'">No</button>
                <button class="btn-action" style="background:var(--danger); color:white;" onclick="location.reload()">Sí, Salir</button>
            </div>
        </div>
    </div>

    <script>
        let currentSection = 'horarios'; 
        
        const navConfig = {
            'horarios': { icon: 'fa-clock', label: 'Sol/Luna' },
            'eventos': { icon: 'fa-calendar-star', label: 'Eventos' },
            'cielo_austral': { icon: 'fa-star', label: 'Cielo' },
            'instrumentos': { icon: 'fa-telescope', label: 'Equipos' },
            'contacto': { icon: 'fa-envelope', label: 'Contacto' }
        };

        const appData = {
            'horarios': {
                title: 'Efemérides Diarias (Posadas, Misiones)',
                headers: ['Astro', 'Salida', 'Puesta', 'Zenit'],
                data: []
            },
            'eventos': {
                title: 'Eventos Enero 2026',
                headers: ['Fecha', 'Evento', 'Visibilidad'],
                data: [
                    ['03-01-2026', 'Lluvia de Cuadrántidas', 'Media'],
                    ['10-01-2026', 'Luna Llena', 'Excelente'],
                    ['18-01-2026', 'Conjunción Marte-Luna', 'Alta'],
                    ['26-01-2026', 'Luna Nueva', 'Ideal Espacio Profundo']
                ]
            },
            'cielo_austral': {
                title: 'Objetos Destacados',
                headers: ['Objeto', 'Tipo', 'Constelación'],
                data: [
                    ['Cruz del Sur', 'Constelación', 'Crux'],
                    ['Nebulosa Carina', 'Nebulosa', 'Carina'],
                    ['Alpha Centauri', 'Sistema Estelar', 'Centaurus']
                ]
            },
            'instrumentos': {
                title: 'Equipamiento Sugerido',
                headers: ['Tipo', 'Aumento', 'Uso'],
                data: [
                    ['Binoculares', '10x50', 'Gran Campo'],
                    ['Reflector', '150/750', 'Espacio Profundo'],
                    ['Refractor', '90/900', 'Planetaria']
                ]
            },
            'contacto': {
                title: 'Contacto',
                headers: ['Red', 'Usuario', 'Link'],
                data: [
                    ['Instagram', '@astroamigos_mnes', 'Ver'],
                    ['WhatsApp', 'Comunidad', 'Unirse']
                ]
            }
        };

        // --- API FETCH (Datos Reales) ---
        async function fetchAstroData() {
            try {
                // Coordenadas aproximadas de Posadas, Misiones
                const lat = -27.3671;
                const lng = -55.8961;
                const response = await fetch(`https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&formatted=0`);
                const json = await response.json();
                
                if(json.status === "OK") {
                    const res = json.results;
                    // Formatear horas UTC a Local (aprox GMT-3)
                    const formatTime = (iso) => new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    appData.horarios.data = [
                        ['Sol', formatTime(res.sunrise), formatTime(res.sunset), formatTime(res.solar_noon)],
                        ['Crepúsculo', formatTime(res.civil_twilight_begin), formatTime(res.civil_twilight_end), '-'],
                        ['Día', res.day_length + ' hs', '', '']
                    ];
                    document.getElementById('api-status').innerHTML = '<i class="fas fa-check-circle"></i> Datos estelares actualizados';
                }
            } catch (e) {
                console.error("Error API", e);
                document.getElementById('api-status').innerText = "Modo Offline: Datos predeterminados";
                appData.horarios.data = [['Sol', '06:15', '19:40', '13:00']];
            }
        }

        function enterApp() {
            const landing = document.getElementById('landing-page');
            const app = document.getElementById('app-container');
            landing.style.opacity = '0';
            setTimeout(() => {
                landing.style.display = 'none';
                app.style.display = 'flex';
                setTimeout(() => { app.style.opacity = '1'; }, 50);
                initNav();
                loadSection(currentSection);
            }, 600);
        }

        function initNav() {
            const desk = document.querySelector('.nav-desktop');
            const mob = document.querySelector('.mobile-nav');
            desk.innerHTML = ''; mob.innerHTML = '';
            Object.keys(navConfig).forEach(k => {
                const cfg = navConfig[k];
                const active = k === currentSection ? 'active' : '';
                desk.innerHTML += `<button class="nav-btn ${active}" onclick="loadSection('${k}')"><i class="fas ${cfg.icon}"></i> ${cfg.label}</button>`;
                mob.innerHTML += `<button class="mobile-nav-btn ${active}" onclick="loadSection('${k}')"><i class="fas ${cfg.icon}"></i> ${cfg.label}</button>`;
            });
        }

        function loadSection(k) {
            currentSection = k;
            document.getElementById('page-title').innerText = appData[k].title;
            renderTable(appData[k]);
            initNav();
        }

        function renderTable(section) {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = ''; body.innerHTML = '';
            
            section.headers.forEach(h => head.innerHTML += `<th>${h}</th>`);
            section.data.forEach(row => {
                let tr = document.createElement('tr');
                row.forEach((cell, i) => {
                    let td = document.createElement('td');
                    td.innerText = cell;
                    td.setAttribute('data-label', section.headers[i]);
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
        }

        function filterTable() {
            let q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#table-body tr').forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function openModal() {
            const container = document.getElementById('modal-form-container');
            container.innerHTML = '';
            appData[currentSection].headers.forEach((h, i) => {
                container.innerHTML += `<div class="form-group"><label>${h}</label><input type="text" id="in-${i}"></div>`;
            });
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        function saveData() {
            let newRow = [];
            appData[currentSection].headers.forEach((_, i) => {
                newRow.push(document.getElementById(`in-${i}`).value || '-');
            });
            appData[currentSection].data.push(newRow);
            renderTable(appData[currentSection]);
            closeModal();
            showToast("Guardado con éxito");
        }

        function showToast(m) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = m;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(appData[currentSection].title, 14, 15);
            doc.autoTable({ head: [appData[currentSection].headers], body: appData[currentSection].data, startY: 20 });
            doc.save('AstroData.pdf');
        }

        function showExitModal() { document.getElementById('exit-modal-overlay').style.display = 'flex'; }

        // Inicializar datos al cargar
        fetchAstroData();
    </script>
</body>
</html>
