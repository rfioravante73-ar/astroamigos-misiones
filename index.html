<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroAmigos · Tucán</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        /* --- ESTRELLAS (más cantidad) --- */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.5);
            animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.7);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* --- CENTRO --- */
        .center-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        /* --- CÍRCULO CONTENEDOR (con borde animado) --- */
        .circle {
            position: relative;
            width: min(65vmin, 500px);
            height: min(65vmin, 500px);
            border-radius: 50%;
            overflow: hidden;
            /* para que la imagen no se salga */
            background: #0b0d1f;
            /* fondo interno */;
        }

        /* --- PSEUDO-ELEMENTO PARA EL BORDE LUMINOSO CELESTE (barrido) --- */
        .circle::before {
            content: '';
            position: absolute;
            inset: -5px;
            /* sobresale para crear el borde */
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    transparent 0%,
                    transparent 20%,
                    #00e5ff 35%,
                    #00b4ff 50%,
                    #00e5ff 65%,
                    transparent 80%,
                    transparent 100%);
            animation: spin-border 2.5s linear infinite;
            z-index: 0;
            /* debajo de la imagen */;
            /* Máscara para mostrar solo el anillo exterior */
            -webkit-mask: radial-gradient(circle at center,
                    transparent 69%,
                    black 70%,
                    black 100%);
            mask: radial-gradient(circle at center,
                    transparent 69%,
                    black 70%,
                    black 100%);
            pointer-events: none;
        }

        /* Animación de rotación del borde */
        @keyframes spin-border {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* --- IMAGEN (zoom) --- */
        .circle img {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.6);
            transform-origin: center center;
            border-radius: 50%;
            /* para que no se vea el fondo en las esquinas */;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 480px) {
            .circle {
                width: min(70vmin, 280px);
                height: min(70vmin, 280px);
            }
            .circle::before {
                inset: -4px;
                -webkit-mask: radial-gradient(circle at center,
                        transparent 67%,
                        black 68%,
                        black 100%);
                mask: radial-gradient(circle at center,
                        transparent 67%,
                        black 68%,
                        black 100%);
            }
            .circle img {
                transform: scale(1.6);
            }
        }

        /* halo decorativo (opcional) */
        .center-wrapper::before {
            content: '';
            position: absolute;
            width: 80vmin;
            height: 80vmin;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div class="center-wrapper">
        <div class="circle">
            <img
            src="https://github.com/app-fioravante/astroamigos-misiones/blob/main/tucan.png?raw=true"
            alt="Tucán - AstroAmigos"
            loading="lazy"
            />
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('stars-container');
            // Aumentamos la cantidad de estrellas
            const STAR_COUNT = 650;
            const MAX_SIZE = 3.2; // más pequeñas para que sean puntuales
            const MIN_SIZE = 0.8;

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < STAR_COUNT; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = Math.random() * (MAX_SIZE - MIN_SIZE) + MIN_SIZE;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                const left = Math.random() * 100;
                const top = Math.random() * 100;
                star.style.left = left + '%';
                star.style.top = top + '%';

                const duration = 1.8 + Math.random() * 4.5;
                star.style.setProperty('--duration', duration + 's');

                const delay = Math.random() * 6;
                star.style.animationDelay = delay + 's';

                // Colores variados (blanco, azulado, amarillento)
                const colorRand = Math.random();
                if (colorRand < 0.08) {
                    star.style.background = '#aaccff';
                    star.style.boxShadow = '0 0 6px 2px rgba(100, 180, 255, 0.4)';
                } else if (colorRand < 0.16) {
                    star.style.background = '#ffdd88';
                    star.style.boxShadow = '0 0 6px 2px rgba(255, 200, 100, 0.3)';
                } else {
                    star.style.background = '#fff';
                    star.style.boxShadow = '0 0 4px 1px rgba(255, 255, 255, 0.5)';
                }

                fragment.appendChild(star);
            }

            container.appendChild(fragment);
        })();
    </script>

</body>
</html>
