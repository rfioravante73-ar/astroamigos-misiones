<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔭 AstroAmigos Misiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 0;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        /* Estrellas */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.5);
            animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== BARRAS AZULES VIBRANTES ===== */
        .bar {
            position: fixed;
            left: 0;
            width: 100%;
            z-index: 10;
            background: #0055ff;
            box-shadow: 0 4px 20px rgba(0, 80, 255, 0.3);
        }

        .bar-top {
            top: 0;
            min-height: 56px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .bar-bottom {
            bottom: 0;
            min-height: 56px;
            border-top: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .top-info,
        .bottom-info {
            display: flex;
            gap: 2rem;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
            padding: 8px 0;
        }

        .top-info span,
        .bottom-info span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Responsive barras - Ocultar completamente en móvil */
        @media (max-width: 768px) {
            .bar {
                display: none !important;
            }
            body {
                padding: 20px 0;
            }
        }

        /* Centro: imagen + texto */
        .center-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            gap: 2rem;
            padding: 0 20px;
        }

        /* Círculo con imagen */
        .circle-wrapper {
            position: relative;
            width: min(60vmin, 460px);
            height: min(60vmin, 460px);
            border-radius: 50%;
            box-shadow: 0 0 40px 12px rgba(0, 180, 255, 0.25);
            flex-shrink: 0;
        }

        .circle-wrapper::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    #004466 0%,
                    #00ccff 20%,
                    #0088ff 35%,
                    #00ccff 50%,
                    #004466 65%,
                    #004466 100%);
            animation: spin-light 2.2s linear infinite;
            mask: radial-gradient(circle at center,
                    transparent 62%,
                    black 63%,
                    black 100%);
            -webkit-mask: radial-gradient(circle at center,
                    transparent 62%,
                    black 63%,
                    black 100%);
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 0 18px #00aaff) drop-shadow(0 0 40px #0066ff);
        }

        @keyframes spin-light {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .circle {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #0b0d1f;
        }

        .circle img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.6);
            transform-origin: center center;
            border-radius: 50%;
        }

        @media (max-width: 480px) {
            .circle-wrapper {
                width: min(70vmin, 280px);
                height: min(70vmin, 280px);
            }
            .circle-wrapper::before {
                inset: -6px;
                mask: radial-gradient(circle at center,
                        transparent 60%,
                        black 61%,
                        black 100%);
                -webkit-mask: radial-gradient(circle at center,
                        transparent 60%,
                        black 61%,
                        black 100%);
            }
            .circle img { transform: scale(1.6); }
        }

        /* ===== TEXTO MODERNO Y CREATIVO ===== */
        .text-block {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .text-block .main-title {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(2.2rem, 8vmin, 4.5rem);
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f9ff 0%, #b0e0ff 50%, #7fc9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 150, 255, 0.2);
            line-height: 1.1;
        }

        .text-block .sub-title {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: clamp(1rem, 3vmin, 1.8rem);
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.15);
            margin-top: 0.2rem;
        }

        @media (max-width: 380px) {
            .text-block .main-title { font-size: 1.8rem; }
            .text-block .sub-title { font-size: 0.8rem; letter-spacing: 0.2em; }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <!-- Barra superior con efemérides (azul vibrante) -->
    <div class="bar bar-top">
        <div class="top-info">
            <span>✨ Lluvia de Perseidas (12 Ago)</span>
            <span>🌕 Eclipse Lunar Parcial (28 Ago)</span>
            <span>🌑 Eclipse Solar Anular (2 Oct)</span>
        </div>
    </div>

    <!-- Barra inferior con datos (azul vibrante) -->
    <div class="bar bar-bottom">
        <div class="bottom-info">
            <span>📅 24 de Julio, 2026</span>
            <span>📍 Posadas, Argentina: 14°C, Nublado</span>
            <span>☀️ Sol: 07:29 ↑ • 18:11 ↓</span>
            <span>🌙 Luna: 13:54 ↑ • 03:31 ↓</span>
        </div>
    </div>

    <div class="center-wrapper">
        <!-- Círculo con imagen -->
        <div class="circle-wrapper">
            <div class="circle">
                <img
                src="https://github.com/app-fioravante/astroamigos-misiones/blob/main/tucan.png?raw=true"
                alt="Tucán - AstroAmigos"
                loading="lazy"
                />
            </div>
        </div>

        <!-- Texto debajo -->
        <div class="text-block">
            <div class="main-title">Astroamigos Misiones</div>
            <div class="sub-title">Astronomía Aficionada</div>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('stars-container');
            const STAR_COUNT = 650;
            const MAX_SIZE = 3.2;
            const MIN_SIZE = 0.8;

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < STAR_COUNT; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = Math.random() * (MAX_SIZE - MIN_SIZE) + MIN_SIZE;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                const left = Math.random() * 100;
                const top = Math.random() * 100;
                star.style.left = left + '%';
                star.style.top = top + '%';

                const duration = 1.8 + Math.random() * 4.5;
                star.style.setProperty('--duration', duration + 's');

                const delay = Math.random() * 6;
                star.style.animationDelay = delay + 's';

                const colorRand = Math.random();
                if (colorRand < 0.08) {
                    star.style.background = '#aaccff';
                    star.style.boxShadow = '0 0 6px 2px rgba(100, 180, 255, 0.4)';
                } else if (colorRand < 0.16) {
                    star.style.background = '#ffdd88';
                    star.style.boxShadow = '0 0 6px 2px rgba(255, 200, 100, 0.3)';
                } else {
                    star.style.background = '#fff';
                    star.style.boxShadow = '0 0 4px 1px rgba(255, 255, 255, 0.5)';
                }

                fragment.appendChild(star);
            }

            container.appendChild(fragment);
        })();
    </script>

</body>
</html>
