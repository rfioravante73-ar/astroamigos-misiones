<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astroamigos Misiones | Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Paleta Astroamigos modernizada */
            --background: oklch(0.98 0.01 240);
            --foreground: oklch(0.25 0.05 240);
            --primary: oklch(0.35 0.08 245); /* Navy Blue */
            --primary-light: oklch(0.45 0.12 245);
            --secondary: oklch(0.20 0.06 250); /* Darker Navy */
            --accent: oklch(0.65 0.15 240); /* Azure */
            --border: oklch(0.90 0.02 240);
            --input-bg: oklch(1 0 0);
            --radius: 1.5rem;
            --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--background);
            min-height: 100vh;
            color: var(--foreground);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 700px;
        }

        /* Panel Izquierdo - Visual */
        .image-panel {
            flex: 1.2;
            background: linear-gradient(rgba(26, 58, 95, 0.8), rgba(26, 58, 95, 0.9)), 
                        url('https://images.unsplash.com/photo-1464802686167-b939a6910659?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        .panel-text-content {
            color: white; 
            text-align: center;
            z-index: 2; 
        }

        .panel-text-content h1 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.1;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Panel Central - Branding Animado */
        .center-panel {
            flex: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .animated-icon {
            width: 160px;
            height: 160px;
            margin-bottom: 30px;
            position: relative;
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .animated-icon img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 10px;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .brand-subtitle {
            font-size: 1rem;
            opacity: 0.8;
            text-align: center;
            max-width: 250px;
        }

        /* Panel Derecho - Formulario */
        .right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 45px;
            background: white;
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-header h2 {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--foreground);
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
        }

        .input-with-icon input {
            width: 100%;
            padding: 14px 15px 14px 48px;
            border: 2px solid var(--border);
            border-radius: 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-with-icon input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px oklch(0.65 0.15 240 / 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px oklch(0.35 0.08 245 / 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .error-message {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            min-height: 20px;
            font-weight: 500;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .modal-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: oklch(0.4 0.02 240);
        }

        .modal-body h4 {
            color: var(--secondary);
            margin: 15px 0 8px 0;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--foreground);
        }

        /* Resto de estilos originales */
        .social-section {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 25px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .social-icons a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--background);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.85rem;
            color: oklch(0.5 0.01 240);
            text-align: center;
        }

        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @media (max-width: 992px) {
            .image-panel { display: none; }
            .login-container { max-width: 800px; }
        }

        @media (max-width: 600px) {
            .login-container { flex-direction: column; }
            .center-panel { padding: 30px; }
            .right-panel { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="image-panel">
            <div class="panel-text-content">
                <h1>Explorando el Universo Juntos</h1>
            </div>
        </div>

        <div class="center-panel">
            <div class="animated-icon">
                <img src="https://raw.githubusercontent.com/rfioravante73-ar/astroamigos-misiones/refs/heads/main/tucan.avif" alt="Logo">
            </div>
            <h1 class="brand-title">Astroamigos Misiones</h1>
            <p class="brand-subtitle">Portal de Astronomía Aficionada en Misiones, Argentina</p>
        </div>

        <div class="right-panel">
            <div class="form-header">
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales de acceso</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Tu usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="error-message" id="errorMessage"></div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="social-section">
                <p style="font-size: 0.9rem; color: #666;">Nuestras Redes</p>
                <div class="social-icons">
                    <a href="https://www.youtube.com/@romulofioravante9329" target="_blank"><i class="fab fa-youtube"></i></a>
                    <a href="https://www.facebook.com/astroamigosmisiones.astronomiaaficionada" target="_blank"><i class="fab fa-facebook"></i></a>
                    <a href="https://astroamigosmisiones.blogspot.com/" target="_blank"><i class="fab fa-blogger"></i></a>
                    <a href="https://astroamigosweb.wixsite.com/2025" target="_blank"><i class="fas fa-globe"></i></a>
                </div>
            </div>

            <div class="footer-links">
                &copy; 2026 Astroamigos Misiones<br>
                <a id="btnPrivacidad">Privacidad</a> | <a id="btnTerminos">Términos de uso</a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button>
            <div id="modalContent">
                </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContent = document.getElementById('modalContent');
            const closeModal = document.getElementById('closeModal');

            // Lógica de Login
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const user = document.getElementById('username').value.trim();
                const pass = document.getElementById('password').value.trim();
                
                if (user === 'astro' && pass === 'a123') {
                    errorMessage.style.color = '#10b981';
                    errorMessage.textContent = '¡Éxito! Redirigiendo...';
                    sessionStorage.setItem('authenticated', 'true');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    errorMessage.style.color = '#ef4444';
                    errorMessage.textContent = 'Credenciales incorrectas.';
                }
            });

            // Lógica de Modales (SPA)
            const textos = {
                terminos: `
                    <h2 class="modal-header">Términos de Uso</h2>
                    <div class="modal-body">
                        <p>Al acceder a <strong>Astroamigos Misiones</strong>, aceptas:</p>
                        <h4>Uso del Portal</h4>
                        <p>Este acceso es para miembros y entusiastas. Queda prohibido el uso ilícito o que dañe la integridad de la plataforma.</p>
                        <h4>Seguridad</h4>
                        <p>Eres responsable de la confidencialidad de tus credenciales.</p>
                        <h4>Propiedad Intelectual</h4>
                        <p>Logos (incluyendo el Tucán), textos y material educativo son propiedad de Astroamigos Misiones o terceros autorizados.</p>
                    </div>
                `,
                privacidad: `
                    <h2 class="modal-header">Política de Privacidad</h2>
                    <div class="modal-body">
                        <p>Valoramos tu privacidad en Astroamigos Misiones:</p>
                        <h4>Recopilación de Datos</h4>
                        <p>Solo recolectamos datos para el inicio de sesión y mejorar tu experiencia.</p>
                        <h4>Uso de Cookies</h4>
                        <p>Usamos almacenamiento de sesión temporal para verificar tu identidad mientras navegas.</p>
                        <h4>Terceros</h4>
                        <p>No compartimos tus datos. Los enlaces a YouTube, Facebook y Blogger se rigen por sus propias políticas.</p>
                    </div>
                `
            };

            function abrirModal(tipo) {
                modalContent.innerHTML = textos[tipo];
                modalOverlay.style.display = 'flex';
            }

            document.getElementById('btnTerminos').onclick = () => abrirModal('terminos');
            document.getElementById('btnPrivacidad').onclick = () => abrirModal('privacidad');
            
            closeModal.onclick = () => modalOverlay.style.display = 'none';
            
            window.onclick = (event) => {
                if (event.target == modalOverlay) modalOverlay.style.display = 'none';
            };
        });
    </script>
</body>
</html>
