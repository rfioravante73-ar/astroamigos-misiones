<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Astroamigos Misiones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .left-container {
            flex: 1;
            background: linear-gradient(135deg, #1a3a5f 0%, #2c5282 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .left-container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }

        .logo-container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 90%;
        }

        .logo-container img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .logo-container img:hover {
            transform: scale(1.03);
        }

        .app-title {
            margin-top: 25px;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
            letter-spacing: -0.5px;
            position: relative;
            z-index: 2;
        }

        .app-subtitle {
            margin-top: 8px;
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }

        .right-container {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 2.1rem;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #4b5563;
            font-size: 1.05rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }

        .input-container {
            position: relative;
        }

        .input-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
            background-color: #f9fafb;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #1e40af, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .btn-login:hover {
            background: linear-gradient(to right, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(30, 64, 175, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ef4444;
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            min-height: 22px;
            font-weight: 500;
        }

        .copyright {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .copyright a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .left-container, 
            .right-container {
                width: 100%;
            }
            
            .right-container {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-container">
            <div class="logo-container">
                <img src="https://raw.githubusercontent.com/rfioravante73-ar/astroamigos-misiones/refs/heads/main/tucan.avif" alt="Tucán de Astroamigos">
                <h1 class="app-title">Astroamigos Misiones</h1>
                <p class="app-subtitle">Explorando el universo juntos</p>
            </div>
        </div>
        
        <div class="right-container">
            <div class="login-header">
                <h2>Bienvenido de nuevo</h2>
                <p>Inicia sesión para acceder a tu cuenta</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Usuario</label>
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" class="form-control" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>
                
                <div class="error-message" id="errorMessage"></div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
            
            <div class="copyright">
                &copy; 2026 Astroamigos Misiones. Todos los derechos reservados.<br>
                <a href="#">Política de privacidad</a> | <a href="#">Términos de uso</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                // Verificar credenciales (en una app real, esto se haría en el backend)
                if (username === 'astro' && password === 'a123') {
                    // Simular redirección exitosa
                    errorMessage.style.color = '#10b981';
                    errorMessage.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                    
                    // Deshabilitar el formulario durante la animación
                    loginForm.querySelector('button').disabled = true;
                    loginForm.querySelector('button').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Accediendo...';
                    
                    // Simular redirección después de 1.5 segundos
                    setTimeout(() => {
                        window.location.href = 'https://astroamigos-misiones.example.com/dashboard';
                    }, 1500);
                } else {
                    // Mostrar mensaje de error
                    errorMessage.textContent = 'Usuario o contraseña incorrectos. Intenta de nuevo.';
                    errorMessage.style.color = '#ef4444';
                    
                    // Efecto de vibración para el formulario
                    loginForm.style.animation = 'shake 0.5s';
                    loginForm.addEventListener('animationend', () => {
                        loginForm.style.animation = '';
                    });
                }
            });
            
            // Animación de shake para el formulario
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                    20%, 40%, 60%, 80% { transform: translateX(5px); }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
