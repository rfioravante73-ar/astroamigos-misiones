<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astroamigos Misiones</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary-color: #1a237e;
            --secondary-color: #3949ab;
            --accent-color: #536dfe;
            --danger-color: #d32f2f;
            --danger-dark: #b71c1c;
            --bg-color: #f5f7ff;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-light: #546e7a;
            --border-color: #e1e5eb;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 10px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        /* --- Landing Page (MANTENIDO) --- */
        #landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
            padding: 20px;
            overflow: hidden;
        }

        .landing-content {
            text-align: center;
            color: var(--primary-color);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .landing-image {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 30px;
            background-image: url('https://raw.githubusercontent.com/rfioravante73-ar/astroamigos-misiones/refs/heads/main/tucan.avif');
            background-size: cover;
            background-position: center;
        }

        .landing-content h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .landing-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 600px;
            line-height: 1.5;
            color: var(--text-light);
        }

        .btn-enter {
            padding: 15px 40px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .btn-enter:hover {
            transform: translateY(-2px);
            background-color: var(--secondary-color);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .timer-text {
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.8;
            color: var(--primary-color);
        }

        /* --- App Layout REFACTORIZADO --- */
        #app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        /* Top Sidebar */
        .top-sidebar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 100;
            min-height: 70px;
        }

        .top-sidebar-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand i {
            font-size: 1.8rem;
            color: #ffd700;
        }

        .top-nav {
            display: flex;
            gap: 5px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            padding: 18px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: var(--radius) var(--radius) 0 0;
            position: relative;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-btn.active {
            background: var(--card-bg);
            color: var(--primary-color);
            font-weight: 600;
            box-shadow: 0 -4px 8px rgba(0, 0, 0, 0.05);
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ffd700;
        }

        .btn-exit {
            padding: 10px 24px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-exit:hover {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 5px solid var(--accent-color);
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            padding: 12px 18px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            width: 280px;
            font-size: 0.95rem;
            transition: var(--transition);
            background-color: white;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.1);
        }

        .btn-action {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .btn-add {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-pdf {
            background: linear-gradient(to right, #d32f2f, #f44336);
            color: white;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        /* Table */
        .table-container {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
        }

        th {
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }

        tr:hover {
            background-color: #f8f9ff;
        }

        /* Modal de datos (existente) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: modalAppear 0.3s ease;
        }

        @keyframes modalAppear {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-header h3 {
            font-size: 1.5rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            line-height: 1;
        }

        .close-modal:hover {
            color: var(--danger-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
            background-color: white;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.1);
        }

        .modal-footer {
            margin-top: 30px;
            text-align: right;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        /* Modal de Salir (nuevo) */
        .exit-modal-content {
            max-width: 450px;
            border-top: 8px solid var(--danger-color);
            text-align: center;
        }

        .exit-modal-content .modal-header {
            justify-content: center;
            border-bottom: none;
            padding-bottom: 0;
        }

        .exit-modal-content .modal-header h3 {
            color: var(--danger-color);
            font-size: 1.6rem;
        }

        .exit-modal-body {
            padding: 20px 0;
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .exit-modal-footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            border-top: none;
            padding-top: 0;
        }

        .btn-cancel {
            background-color: #f0f0f0;
            color: var(--text-color);
            padding: 12px 30px;
            border: 2px solid var(--border-color);
        }

        .btn-cancel:hover {
            background-color: #e0e0e0;
        }

        .btn-confirm-exit {
            background: linear-gradient(to right, var(--danger-color), var(--danger-dark));
            color: white;
            padding: 12px 30px;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .top-nav {
                overflow-x: auto;
                padding-bottom: 5px;
            }
            
            .nav-btn span {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 768px) {
            #app-container {
                overflow-y: auto;
            }
            
            .top-sidebar {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            
            .top-sidebar-left {
                flex-direction: column;
                gap: 15px;
                width: 100%;
            }
            
            .top-nav {
                width: 100%;
                justify-content: center;
            }
            
            .nav-btn {
                padding: 12px 15px;
                font-size: 0.85rem;
            }
            
            .header-panel {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .controls {
                flex-direction: column;
                width: 100%;
            }
            
            .search-box {
                width: 100%;
            }
            
            .btn-exit {
                width: 100%;
                justify-content: center;
            }
            
            /* Landing page mobile */
            .landing-image {
                width: 200px;
                height: 200px;
            }
            
            .landing-content h1 {
                font-size: 2rem;
            }
            
            .landing-content p {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .nav-btn span {
                display: none;
            }
            
            .nav-btn i {
                font-size: 1.2rem;
            }
            
            .landing-image {
                width: 180px;
                height: 180px;
                margin-bottom: 20px;
            }
            
            .landing-content h1 {
                font-size: 1.8rem;
            }
            
            .btn-enter {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Landing Page (MANTENIDO) -->
    <div id="landing-page">
        <div class="landing-content">
            <div class="landing-image"></div>
            <h1>Astroamigos Misiones</h1>
            <p>La mejor manera de descubrir el Universo</p>
            <button class="btn-enter" onclick="enterApp()">Ingresar</button>
            <p class="timer-text">Ingresando automáticamente en <span id="countdown">10</span>s...</p>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container" style="display: none;">
        <!-- Top Sidebar -->
        <header class="top-sidebar">
            <div class="top-sidebar-left">
                <div class="brand">
                    <i class="fas fa-star"></i>
                    <span>Astroamigos</span>
                </div>
                <nav class="top-nav">
                    <button class="nav-btn active" onclick="loadSection('sobre_nosotros')">
                        <i class="fas fa-users"></i> <span>Sobre Nosotros</span>
                    </button>
                    <button class="nav-btn" onclick="loadSection('cielo_austral')">
                        <i class="fas fa-globe-americas"></i> <span>Cielo Austral</span>
                    </button>
                    <button class="nav-btn" onclick="loadSection('eventos')">
                        <i class="fas fa-calendar-star"></i> <span>Eventos</span>
                    </button>
                    <button class="nav-btn" onclick="loadSection('horarios')">
                        <i class="fas fa-clock"></i> <span>Sol/Luna</span>
                    </button>
                    <button class="nav-btn" onclick="loadSection('consejos')">
                        <i class="fas fa-binoculars"></i> <span>Consejos</span>
                    </button>
                    <button class="nav-btn" onclick="loadSection('instrumentos')">
                        <i class="fas fa-microscope"></i> <span>Instrumentos</span>
                    </button>
                    <button class="nav-btn" onclick="loadSection('contacto')">
                        <i class="fas fa-envelope"></i> <span>Contacto</span>
                    </button>
                </nav>
            </div>
            <button class="btn-exit" onclick="showExitModal()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-panel">
                <h2 id="page-title" class="section-title">Sobre Nosotros</h2>
                <div class="controls">
                    <input type="text" id="search-input" class="search-box" placeholder="Buscar en la tabla..." onkeyup="filterTable()">
                    <button class="btn-action btn-add" onclick="openModal()">
                        <i class="fas fa-plus"></i> Nuevo
                    </button>
                    <button class="btn-action btn-pdf" onclick="exportPDF()">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table id="data-table">
                    <thead>
                        <tr id="table-head">
                            <!-- Headers dinámicos -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Datos dinámicos -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para agregar/editar datos (existente) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Agregar Nuevo Registro</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-form-container">
                <!-- Formulario dinámico -->
            </div>
            <div class="modal-footer">
                <button class="btn-action btn-add" onclick="saveData()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación de salida (nuevo) -->
    <div id="exit-modal-overlay" class="modal-overlay">
        <div class="modal-content exit-modal-content">
            <div class="modal-header">
                <h3>¿Está seguro que desea salir?</h3>
            </div>
            <div class="exit-modal-body">
                <p>Si sale de la aplicación, perderá cualquier dato no guardado y volverá a la página de inicio.</p>
                <p><i class="fas fa-exclamation-triangle" style="color: #d32f2f; margin-top: 10px;"></i></p>
            </div>
            <div class="modal-footer exit-modal-footer">
                <button class="btn-action btn-cancel" onclick="closeExitModal()">Cancelar</button>
                <button class="btn-action btn-confirm-exit" onclick="confirmExit()">Salir de la App</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Lógica Landing Page (MANTENIDA) ---
        let countdown = 10;
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                countdown--;
                document.getElementById('countdown').innerText = countdown;
                if (countdown <= 0) {
                    enterApp();
                }
            }, 1000);
        }

        function enterApp() {
            clearInterval(timerInterval);
            document.getElementById('landing-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('landing-page').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
            }, 500);
        }

        window.onload = startTimer;

        // --- 2. Datos y Estado de la App (MANTENIDO) ---
        let currentSection = 'sobre_nosotros';

        const appData = {

                    ['Carina', 'Noroeste', 'Canopus (α Car)', '2da estrella más brillante del cielo nocturno'],
                    ['Scorpius', 'Este', 'Antares (α Sco)', 'Supergigante roja, visible en tono anaranjado'],
                    ['Vela', 'Cenit', 'Suhail (λ Vel)', 'Restos de supernova visibles con telescopio'],
                    ['Pavo', 'Sur', 'Peacock (α Pav)', 'Visible cerca del horizonte sur'],
                    ['Octans', 'Circumpolar', 'Polaris Australis (σ Oct)', 'Contiene el polo sur celeste']

            },
            'eventos': {

                data: [

                ]
            },
            'horarios': {

                data: [

                    ['Luna', '15-04-2025', '05:20', '17:45', 'Creciente menguante'],
                    ['Sol', '16-04-2025', '06:46', '18:09', 'Día: 11h 23m'],

                    ['Sol', '17-04-2025', '06:47', '18:08', 'Día: 11h 21m'],
                    ['Luna', '17-04-2025', '07:10', '19:15', 'Menguante'],
                    ['Sol', '18-04-2025', '06:47', '18:07', 'Día: 11h 20m'],
                    ['Luna', '18-04-2025', '08:05', '20:00', 'Menguante']
                ]
            },
            'consejos': {
                title: 'Consejos de Observación',
                headers: ['Tema', 'Consejo', 'Nivel'],
                data: [
                    ['Ubicación', 'Buscar lugares alejados de luces urbanas (mínimo 30km)', 'Principiante'],

                    ['Equipamiento', 'Empezar con binoculares 7x50 antes de telescopio', 'Intermedio'],
                    ['Planificación', 'Usar apps como Stellarium para conocer qué observar', 'Intermedio'],
                    ['Astrofotografía', 'Empezar con trípode y exposiciones cortas (<30s)', 'Avanzado'],
                    ['Clima', 'Evitar noches con humedad >80% para evitar rocío en lentes', 'Todos'],
                    ['Seguridad', 'Nunca observar el Sol sin filtros certificados', 'Crítico']
                ]
            },
            'instrumentos': {
                title: 'Instrumentos Ópticos',
                headers: ['Tipo', 'Modelo Recomendado', 'Uso Principal'],
                data: [
                    ['Binoculares', 'Celestron 7x50', 'Observación general y constelaciones'],
                    ['Telescopio Refractor', 'SkyWatcher 80/900', 'Planetas y Luna (principiantes)'],
                    ['Telescopio Reflector', 'Orion SkyQuest XT6', 'Cielo profundo (nebulosas, galaxias)'],
                    ['Telescopio Catadióptrico', 'Celestron NexStar 6SE', 'Todo uso con montura computerizada'],
                    ['Oculares', 'Plössl 25mm y 10mm', 'Aumentos básicos para cualquier telescopio'],
                    ['Filtros', 'Moon filter ND25', 'Reducir brillo lunar para observación cómoda'],
                    ['Montura', 'SkyWatcher HEQ5', 'Astrofotografía con seguimiento preciso']
                ]
            },
            'contacto': {
                title: 'Contacto',
                headers: ['Canal', 'Detalle', 'Horario Atención'],
                data: [
                    ['Email', 'info@astroamigosmisiones.org.ar', 'Lunes a Viernes 9-18h'],
                    ['Teléfono', '+54 376 442-1234', 'Lunes a Viernes 14-20h'],
                    ['WhatsApp', '+54 9 376 512-5678', 'Todos los días 18-22h'],
                    ['Facebook', 'facebook.com/astroamigosmisiones', '24/7 (respuesta en 24h)'],
                    ['Instagram', '@astroamigos_misiones', '24/7 (respuesta en 12h)'],
                    ['Observatorio', 'Ruta 12 km 5, Posadas', 'Sábados 20-23h (con reserva)'],
                    ['Talleres', 'Centro Cultural Misiones', '1er sábado de cada mes 15-17h']
                ]
            }
        };

        // --- 3. Navegación ---
        function loadSection(sectionKey) {
            currentSection = sectionKey;
            
            // Actualizar botones activos
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const buttons = document.querySelectorAll('.nav-btn');
            const keys = Object.keys(appData);
            const index = keys.indexOf(sectionKey);
            if(buttons[index]) buttons[index].classList.add('active');

            // Actualizar contenido
            const sectionData = appData[sectionKey];
            document.getElementById('page-title').innerText = sectionData.title;
            renderTable(sectionData);
        }

        function renderTable(sectionData) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            
            // Limpiar
            thead.innerHTML = '';
            tbody.innerHTML = '';

            // Headers
            sectionData.headers.forEach(header => {
                const th = document.createElement('th');
                th.innerText = header;
                thead.appendChild(th);
            });

            // Rows
            sectionData.data.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.innerText = cell;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // --- 4. Búsqueda (MANTENIDA) ---
        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sectionData = appData[currentSection];
            
            const filteredData = sectionData.data.filter(row => {
                return row.some(cell => cell.toLowerCase().includes(query));
            });

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.innerText = cell;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // --- 5. Modal de datos (MANTENIDO) ---
        function openModal() {
            const modal = document.getElementById('modal-overlay');
            const container = document.getElementById('modal-form-container');
            const headers = appData[currentSection].headers;
            
            container.innerHTML = '';

            headers.forEach((header, index) => {
                const div = document.createElement('div');
                div.className = 'form-group';
                
                const label = document.createElement('label');
                label.innerText = header;
                
                const input = document.createElement('input');
                input.type = 'text';
                input.id = `input-${index}`;
                input.placeholder = `Ingrese ${header}`;

                div.appendChild(label);
                div.appendChild(input);
                container.appendChild(div);
            });

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function saveData() {
            const headers = appData[currentSection].headers;
            const newRow = [];
            let allFilled = true;

            headers.forEach((_, index) => {
                const val = document.getElementById(`input-${index}`).value;
                if(val.trim() === '') allFilled = false;
                newRow.push(val);
            });

            if(!allFilled) {
                alert('Por favor complete todos los campos');
                return;
            }

            appData[currentSection].data.push(newRow);
            loadSection(currentSection);
            closeModal();
            document.getElementById('search-input').value = '';
        }

        // --- 6. Modal de Salir (NUEVO) ---
        function showExitModal() {
            document.getElementById('exit-modal-overlay').style.display = 'flex';
        }

        function closeExitModal() {
            document.getElementById('exit-modal-overlay').style.display = 'none';
        }

        function confirmExit() {
            // Regresar a la landing page
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('landing-page').style.display = 'flex';
            document.getElementById('landing-page').style.opacity = '1';
            
            // Reiniciar timer
            clearInterval(timerInterval);
            countdown = 10;
            document.getElementById('countdown').innerText = countdown;
            startTimer();
            
            closeExitModal();
        }

        // Cerrar modales al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('modal-overlay');
            const exitModal = document.getElementById('exit-modal-overlay');
            
            if (event.target == modal) {
                closeModal();
            }
            if (event.target == exitModal) {
                closeExitModal();
            }
        }

        // --- 7. Exportar PDF (MANTENIDO) ---
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const section = appData[currentSection];
            
            doc.setFontSize(18);
            doc.text(`Astroamigos Misiones - ${section.title}`, 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            
            doc.autoTable({
                head: [section.headers],
                body: section.data,
                startY: 30,
                theme: 'grid',
                headStyles: { fillColor: [26, 35, 126] }
            });

            doc.save(`${section.title}_Astroamigos.pdf`);
        }

        // Inicializar
        renderTable(appData['sobre_nosotros']);
    </script>
</body>
</html>
