<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicaciones</title>
    <style>
        :root {
            --azul-oscuro: #1a3a5f;
            --azul-brillante: #007bff;
            --azul-claro: #f0f7ff;
            --blanco: #ffffff;
            --gris-texto: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--azul-claro);
            color: var(--gris-texto);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--blanco);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--azul-claro);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--azul-oscuro);
            margin: 0;
            font-size: 1.8rem;
        }

        p {
            color: #666;
            font-size: 0.95rem;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            text-align: left;
            padding: 15px;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #f9fcff;
            transition: 0.3s;
        }

        .btn-link {
            display: inline-block;
            padding: 8px 12px;
            background-color: var(--azul-brillante);
            color: white;
            text-decoration: none;
            border-radius:
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-link:hover {
            background-color: var(--azul-oscuro);
            transform: translateY(-2px);
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: #e1ecf4;
            color: #39739d;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Aplicación</th>
                    <th>Plataforma</th>
                    <th>Función Principal</th>
                    <th>Acceso</th>
                </tr>
            </thead>
            <tbody id="app-table">
                </tbody>
        </table>
    </div>
</div>

<script>
    const apps = [
        {
            nombre: "Stellarium Web",
            plataforma: "Navegador / PC",
            funcion: "Planetario 3D en tiempo real.",
            url: "https://stellarium-web.org/"
        },
        {
            nombre: "Heavens-Above",
            plataforma: "Web / Android",
            funcion: "Rastreo de satélites e ISS.",
            url: "https://www.heavens-above.com/"
        },
        {
            nombre: "Meteoblue",
            plataforma: "Web / Móvil",
            funcion: "Previsión de 'seeing' astronómico.",
            url: "https://www.meteoblue.com/es/tiempo/outdoorsports/seeing"
        },
        {
            nombre: "Cartes du Ciel",
            plataforma: "PC (Escritorio)",
            funcion: "Cartas celestes para observación.",
            url: "https://www.ap-i.net/skychart/es/start"
        },
        {
            nombre: "Virtual Moon Atlas",
            plataforma: "PC (Windows)",
            funcion: "Exploración lunar detallada.",
            url: "https://www.ap-i.net/avl/en/start"
        },
        {
            nombre: "Sky Map",
            plataforma: "Android",
            funcion: "Mapa estelar con Realidad Aumentada.",
            url: "https://play.google.com/store/apps/details?id=com.google.android.stardroid"
        }
    ];

    const tableBody = document.getElementById('app-table');

    function loadTable() {
        tableBody.innerHTML = apps.map(app => `
            <tr>
                <td><strong>${app.nombre}</strong></td>
                <td><span class="tag">${app.plataforma}</span></td>
                <td>${app.funcion}</td>
                <td>
                    <a href="${app.url}" target="_blank" class="btn-link">Visitar</a>
                </td>
            </tr>
        `).join('');
    }

    // Inicializar SPA
    window.onload = loadTable;
</script>

</body>
</html>
