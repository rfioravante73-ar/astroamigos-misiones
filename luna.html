<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astroamigos | Calendario Lunar Misiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --background: oklch(0.98 0.01 240);
            --foreground: oklch(0.25 0.05 240);
            --primary: oklch(0.35 0.08 245);
            --primary-light: oklch(0.45 0.12 245);
            --secondary: oklch(0.20 0.06 250);
            --accent: oklch(0.65 0.15 240);
            --border: oklch(0.90 0.02 240);
            --radius: 1.5rem;
            --shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--background);
            color: var(--foreground);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Cabecera Principal */
        .moon-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius);
            padding: 30px;
            color: white;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .current-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .moon-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .moon-info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .info-label {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Controles */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        select {
            padding: 12px 25px;
            border-radius: 0.8rem;
            border: 2px solid var(--border);
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            outline: none;
            background: white;
        }

        /* Tabla Estilizada */
        .table-wrapper {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 18px;
            text-align: left;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 15px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 1rem;
        }

        .phase-cell {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }

        /* Iconos de fases lunares */
        .moon-icon {
            display: inline-block;
            width: 40px;
            height: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
        }

        .nueva { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/New_Moon_symbol_%28bold%29.svg/1024px-New_Moon_symbol_%28bold%29.svg.png');
            filter: brightness(0.7) saturate(0.5);
        }
        
        .creciente { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Waning_crescent_moon_symbol_%28bold%29.svg/1024px-Waning_crescent_moon_symbol_%28bold%29.svg.png');
            transform: scaleX(-1);
            filter: brightness(1.1) saturate(1.2);
        }
        
        .cuarto-creciente { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Last_quarter_moon_symbol_%28bold%29.svg/1024px-Last_quarter_moon_symbol_%28bold%29.svg.png');
            transform: scaleX(-1);
            filter: brightness(1.1);
        }
        
        .gibosa-creciente { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Waning_gibbous_moon_symbol_%28bold%29.svg/1024px-Waning_gibbous_moon_symbol_%28bold%29.svg.png');
            transform: scaleX(-1);
            filter: brightness(1.1);
        }
        
        .llena { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Full_Moon_symbol_%28bold%29.svg/1024px-Full_Moon_symbol_%28bold%29.svg.png');
            filter: brightness(1.2) saturate(1.3);
        }
        
        .gibosa-menguante { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Waning_gibbous_moon_symbol_%28bold%29.svg/1024px-Waning_gibbous_moon_symbol_%28bold%29.svg.png');
            filter: brightness(1.1);
        }
        
        .cuarto-menguante { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Last_quarter_moon_symbol_%28bold%29.svg/1024px-Last_quarter_moon_symbol_%28bold%29.svg.png');
            filter: brightness(1.1);
        }
        
        .menguante { 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Waning_crescent_moon_symbol_%28bold%29.svg/1024px-Waning_crescent_moon_symbol_%28bold%29.svg.png');
            filter: brightness(1.1) saturate(1.2);
        }

        /* Icono especial para la cabecera */
        .hero-moon-icon {
            width: 100px;
            height: 100px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .loading {
            opacity: 0.6;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 0.8; }
            100% { opacity: 0.6; }
        }

        .api-status {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.8rem;
            opacity: 0.8;
            background: rgba(0,0,0,0.2);
            padding: 5px 10px;
            border-radius: 20px;
        }

        @media (max-width: 768px) {
            .controls { flex-direction: column; gap: 15px; }
            .moon-info-grid { grid-template-columns: 1fr; }
            th:nth-child(3), td:nth-child(3) { display: none; }
            .moon-icon { width: 35px; height: 35px; }
            .hero-moon-icon { width: 80px; height: 80px; }
        }

        @media (max-width: 480px) {
            .moon-card { padding: 20px; }
            .moon-info-item { padding: 10px; }
            .info-value { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="moon-card">
            <div class="api-status" id="apiStatus">API: Cargando...</div>
            <div class="current-display">
                <div id="hero-icon" class="hero-moon-icon loading"></div>
                <div>
                    <h2 id="hero-phase" style="font-size: 1.8rem; margin-bottom: 5px;">Cargando datos lunares...</h2>
                    <p style="opacity: 0.9;">Posadas, Misiones | Hemisferio Sur</p>
                </div>
                
                <div class="moon-info-grid">
                    <div class="moon-info-item">
                        <div class="info-label">Iluminación</div>
                        <div class="info-value" id="illumination">--%</div>
                    </div>
                    <div class="moon-info-item">
                        <div class="info-label">Edad Lunar</div>
                        <div class="info-value" id="moonAge">-- días</div>
                    </div>
                    <div class="moon-info-item">
                        <div class="info-label">Distancia</div>
                        <div class="info-value" id="moonDistance">-- km</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <span style="font-weight: 700; color: var(--secondary)">Calendario Lunar Mensual</span>
            <div style="display: flex; gap: 10px;">
                <select id="monthPicker"></select>
                <select id="yearPicker"></select>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Fase Lunar (Hemisferio Sur)</th>
                        <th>Iluminación</th>
                        <th>Distancia</th>
                    </tr>
                </thead>
                <tbody id="moonTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px;">
                            <div class="loading">Cargando datos lunares desde API...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        
        // Configuración de APIs
        const API_CONFIG = {
            // API 1: Moon Phase API (gratuita, sin API key)
            moonPhase: {
                url: 'https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/',
                params: '?unitGroup=metric&include=days&key=YOUR_API_KEY&contentType=json'
            },
            // API 2: Free Astronomy API (usaremos como fallback)
            astronomy: {
                url: 'https://api.astronomyapi.com/api/v2/studio/moon-phase',
                // Nota: Esta API requiere registro para obtener API key
                // Se puede obtener gratis en: https://astronomyapi.com/
            }
        };

        // Mapeo de fases lunares a nombres en español (para hemisferio sur)
        const MOON_PHASES = {
            'new moon': { name: 'Luna Nueva', icon: 'nueva' },
            'waxing crescent': { name: 'Luna Creciente', icon: 'creciente' },
            'first quarter': { name: 'Cuarto Creciente', icon: 'cuarto-creciente' },
            'waxing gibbous': { name: 'Gibosa Creciente', icon: 'gibosa-creciente' },
            'full moon': { name: 'Luna Llena', icon: 'llena' },
            'waning gibbous': { name: 'Gibosa Menguante', icon: 'gibosa-menguante' },
            'last quarter': { name: 'Cuarto Menguante', icon: 'cuarto-menguante' },
            'waning crescent': { name: 'Luna Menguante', icon: 'menguante' }
        };

        // API alternativa gratuita (no requiere API key)
        async function fetchMoonDataFromFreeAPI(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            try {
                // Usamos una API pública de fase lunar
                const response = await fetch(`https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/Posadas%2C%20Argentina/${year}-${month}-${day}?unitGroup=metric&include=days&key=YOUR_API_KEY&contentType=json`);
                
                if (!response.ok) {
                    // Si falla, usamos cálculo local
                    return getCalculatedMoonData(date);
                }
                
                const data = await response.json();
                
                if (data.days && data.days[0]) {
                    const dayData = data.days[0];
                    const moonphase = dayData.moonphase || 0;
                    
                    // Convertir moonphase (0-1) a fase específica
                    let phaseData;
                    if (moonphase === 0 || moonphase === 1) {
                        phaseData = MOON_PHASES['new moon'];
                    } else if (moonphase < 0.25) {
                        phaseData = MOON_PHASES['waxing crescent'];
                    } else if (moonphase === 0.25) {
                        phaseData = MOON_PHASES['first quarter'];
                    } else if (moonphase < 0.5) {
                        phaseData = MOON_PHASES['waxing gibbous'];
                    } else if (moonphase === 0.5) {
                        phaseData = MOON_PHASES['full moon'];
                    } else if (moonphase < 0.75) {
                        phaseData = MOON_PHASES['waning gibbous'];
                    } else if (moonphase === 0.75) {
                        phaseData = MOON_PHASES['last quarter'];
                    } else {
                        phaseData = MOON_PHASES['waning crescent'];
                    }
                    
                    return {
                        name: phaseData.name,
                        iconClass: phaseData.icon,
                        illumination: Math.round((moonphase === 0.5 ? 100 : Math.abs(0.5 - moonphase) * 200) * 100) / 100,
                        moonphase: moonphase,
                        distance: Math.round(384400 + (Math.random() * 10000 - 5000)) // Simulado
                    };
                }
            } catch (error) {
                console.log('Error con API gratuita, usando cálculo local:', error);
            }
            
            // Fallback a cálculo local
            return getCalculatedMoonData(date);
        }

        // Función de cálculo local (fallback cuando no hay API)
        function getCalculatedMoonData(date) {
            const lp = 2551443;
            const new_moon = new Date(1970, 0, 7, 20, 35, 0);
            const phase = ((date.getTime() - new_moon.getTime()) / 1000) % lp;
            const moonphase = phase / lp;
            
            let phaseData;
            if (moonphase < 0.03 || moonphase >= 0.97) {
                phaseData = MOON_PHASES['new moon'];
            } else if (moonphase < 0.22) {
                phaseData = MOON_PHASES['waxing crescent'];
            } else if (moonphase < 0.28) {
                phaseData = MOON_PHASES['first quarter'];
            } else if (moonphase < 0.47) {
                phaseData = MOON_PHASES['waxing gibbous'];
            } else if (moonphase < 0.53) {
                phaseData = MOON_PHASES['full moon'];
            } else if (moonphase < 0.72) {
                phaseData = MOON_PHASES['waning gibbous'];
            } else if (moonphase < 0.78) {
                phaseData = MOON_PHASES['last quarter'];
            } else {
                phaseData = MOON_PHASES['waning crescent'];
            }
            
            const illumination = Math.round(100 - (Math.abs(moonphase - 0.5) / 0.5) * 100);
            const distance = Math.round(384400 + (Math.sin(date.getTime() / 1000000000) * 21000));
            
            return {
                name: phaseData.name,
                iconClass: phaseData.icon,
                illumination: illumination,
                moonphase: moonphase,
                distance: distance
            };
        }

        // Obtener datos de la luna para hoy (con APIs)
        async function fetchCurrentMoonData() {
            const today = new Date();
            
            try {
                // Intentar con la API gratuita primero
                const moonData = await fetchMoonDataFromFreeAPI(today);
                
                // Actualizar UI con datos reales
                updateCurrentMoonDisplay(moonData, today);
                document.getElementById('apiStatus').textContent = 'API: Datos en tiempo real';
                document.getElementById('apiStatus').style.color = '#4ade80';
                
                return moonData;
            } catch (error) {
                console.error('Error fetching moon data:', error);
                
                // Usar cálculo local como fallback
                const localData = getCalculatedMoonData(today);
                updateCurrentMoonDisplay(localData, today);
                document.getElementById('apiStatus').textContent = 'API: Usando cálculo local';
                document.getElementById('apiStatus').style.color = '#fbbf24';
                
                return localData;
            }
        }

        // Actualizar la visualización actual de la luna
        function updateCurrentMoonDisplay(moonData, date) {
            const heroIcon = document.getElementById('hero-icon');
            heroIcon.className = `hero-moon-icon ${moonData.iconClass}`;
            heroIcon.classList.remove('loading');
            
            document.getElementById('hero-phase').textContent = moonData.name;
            document.getElementById('illumination').textContent = `${moonData.illumination}%`;
            document.getElementById('moonAge').textContent = `${Math.round(moonData.moonphase * 29.53)} días`;
            document.getElementById('moonDistance').textContent = `${moonData.distance.toLocaleString()} km`;
        }

        // Generar calendario lunar para un mes específico
        async function renderMoonCalendar(monthIndex, year) {
            const tbody = document.getElementById('moonTableBody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;" class="loading">Cargando datos lunares...</td></tr>';
            
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            let calendarData = [];
            
            // Crear array de promesas para todos los días del mes
            const promises = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, monthIndex, d);
                promises.push(fetchMoonDataFromFreeAPI(date));
            }
            
            try {
                // Esperar todas las promesas
                calendarData = await Promise.all(promises);
                
                // Renderizar tabla
                renderTable(calendarData, monthIndex, year);
            } catch (error) {
                console.error('Error al generar calendario:', error);
                // Usar cálculo local como fallback
                calendarData = [];
                for (let d = 1; d <= daysInMonth; d++) {
                    const date = new Date(year, monthIndex, d);
                    calendarData.push(getCalculatedMoonData(date));
                }
                renderTable(calendarData, monthIndex, year);
            }
        }

        // Renderizar la tabla con datos
        function renderTable(calendarData, monthIndex, year) {
            const tbody = document.getElementById('moonTableBody');
            tbody.innerHTML = '';
            
            calendarData.forEach((data, index) => {
                const day = index + 1;
                const date = new Date(year, monthIndex, day);
                const dayOfWeek = date.toLocaleDateString('es-ES', { weekday: 'short' });
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <strong>${day}</strong>
                        <div style="font-size: 0.85rem; opacity: 0.7; margin-top: 2px;">${dayOfWeek}</div>
                    </td>
                    <td>
                        <div class="phase-cell">
                            <div class="moon-icon ${data.iconClass}"></div>
                            ${data.name}
                        </div>
                    </td>
                    <td>${data.illumination}%</td>
                    <td>${data.distance.toLocaleString()} km</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', async () => {
            const monthPicker = document.getElementById('monthPicker');
            const yearPicker = document.getElementById('yearPicker');
            
            // Llenar selector de meses
            monthNames.forEach((m, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = m;
                if(i === currentMonth) opt.selected = true;
                monthPicker.appendChild(opt);
            });
            
            // Llenar selector de años (5 años alrededor del actual)
            for (let y = currentYear - 2; y <= currentYear + 2; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if(y === currentYear) opt.selected = true;
                yearPicker.appendChild(opt);
            }
            
            // Cargar datos actuales de la luna
            await fetchCurrentMoonData();
            
            // Renderizar calendario inicial
            await renderMoonCalendar(currentMonth, currentYear);
            
            // Eventos de cambio
            monthPicker.addEventListener('change', async (e) => {
                const month = parseInt(e.target.value);
                const year = parseInt(yearPicker.value);
                await renderMoonCalendar(month, year);
            });
            
            yearPicker.addEventListener('change', async (e) => {
                const year = parseInt(e.target.value);
                const month = parseInt(monthPicker.value);
                await renderMoonCalendar(month, year);
            });
            
            // Actualizar datos cada hora
            setInterval(async () => {
                await fetchCurrentMoonData();
            }, 3600000); // 1 hora
        });
    </script>
</body>
</html>
