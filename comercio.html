<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra</title>
    <style>
        :root {
            --azul-noche: #0d253f;
            --azul-celeste: #00a8e8;
            --fondo: #f4f7f9;
            --blanco: #ffffff;
            --texto: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .spa-container {
            max-width: 1000px;
            width: 100%;
            background: var(--blanco);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background: linear-gradient(135deg, var(--azul-noche) 0%, #163e64 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        header p {
            opacity: 0.9;
            margin-top: 10px;
            font-weight: 300;
        }

        .table-responsive {
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid #eee;
            color: var(--azul-noche);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        td {
            padding: 18px 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #fcfdfe;
        }

        .badge {
            background: #e1f5fe;
            color: #0288d1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn-visit {
            background-color: var(--azul-celeste);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-visit:hover {
            background-color: var(--azul-noche);
            box-shadow: 0 4px 12px rgba(0,168,232,0.3);
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #888;
            background: #fafafa;
        }
    </style>
</head>
<body>

<div class="spa-container">
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Comercio</th>
                    <th>Especialidad</th>
                    <th>Ubicación / Alcance</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tiendas-body">
                </tbody>
        </table>
    </div>

<script>
    const tiendas = [
        {
            nombre: "Duoptic",
            especialidad: "Sky-Watcher y Astrofotografía",
            alcance: "CABA / Envíos Nacionales",
            url: "https://www.duoptic.com.ar"
        },
        {
            nombre: "Óptica Saracco",
            especialidad: "Celestron, Meade y Microscopía",
            alcance: "CABA / Web",
            url: "https://www.saracco.com"
        },
        {
            nombre: "Celestron Argentina",
            especialidad: "Tienda Oficial de la Marca",
            alcance: "Todo el país",
            url: "https://www.celestron.ar"
        },
        {
            nombre: "Cosentino Store",
            especialidad: "Accesorios, Cámaras y Filtros",
            alcance: "Tienda Online",
            url: "https://www.cosentinostore.com.ar"
        },
        {
            nombre: "Leonardo Hobbies",
            especialidad: "Hokenn y Óptica general",
            alcance: "Rosario / Online",
            url: "https://www.leonardohobbies.com.ar"
        },
        {
            nombre: "Planeta Zenok",
            especialidad: "Equipos de iniciación",
            alcance: "Nacional (Múltiples sucursales)",
            url: "https://www.planetazenok.com"
        }
    ];

    const tbody = document.getElementById('tiendas-body');

    function renderTiendas() {
        tbody.innerHTML = tiendas.map(tienda => `
            <tr>
                <td><strong>${tienda.nombre}</strong></td>
                <td>${tienda.especialidad}</td>
                <td><span class="badge">${tienda.alcance}</span></td>
                <td>
                    <a href="${tienda.url}" target="_blank" class="btn-visit">Ver Tienda</a>
                </td>
            </tr>
        `).join('');
    }

    window.onload = renderTiendas;
</script>

</body>
</html>
